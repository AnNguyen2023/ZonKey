[workspace]
resolver = "3"
members = [
    "crates/zonkey-types",
    "crates/zonkey-token",
    "crates/zonkey-telex",
    "crates/zonkey-detect",
    "crates/zonkey-policy",
    "crates/zonkey-config",
    "crates/zonkey-win",
    "crates/zonkey-service",
    "crates/zonkey-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

